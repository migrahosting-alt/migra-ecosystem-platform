name: Workspace Hygiene Gate

on:
  pull_request:
    branches: ["**"]
  # Transition list for the default-branch cutover — see migrateck-platform-ci.yml. This file
  # exists only on canonical, so the `main`-only trigger never fired.
  push:
    branches:
      - main
      - phase-1/canonical-vscode-extension
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workspace-hygiene:
    name: Workspace Hygiene (Strict)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run strict workspace hygiene audit
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/audit-workspace-root.sh --strict