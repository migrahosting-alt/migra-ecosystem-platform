name: pale-staging-backend

# MANUAL-ONLY during the default-branch transition — see pale-staging-deploy.yml for the full
# reasoning. `Software/` has zero tracked files here, so this path filter can never match; the
# workflow has never run. Not widened to canonical: deployment authority must be decided
# explicitly, not acquired as a side effect of a default-branch change. `workflow_dispatch`
# below already preserves emergency and rollback use.
on:
  push:
    branches:
      - main
    paths:
      - "Software/Pale/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Software/Pale
    steps:
      - uses: actions/checkout@v4
      - name: Placeholder staging deploy
        env:
          STAGING_DEPLOY_HOOK_URL: ${{ secrets.PALE_STAGING_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$STAGING_DEPLOY_HOOK_URL" ]; then
            echo "Missing PALE_STAGING_DEPLOY_HOOK_URL secret"
            exit 1
          fi
          curl -X POST "$STAGING_DEPLOY_HOOK_URL"
