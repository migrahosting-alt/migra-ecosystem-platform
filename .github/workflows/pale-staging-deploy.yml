name: Pale — Staging Deploy

# MANUAL-ONLY during the default-branch transition. Deliberately NOT widened to canonical.
#
# This workflow cannot deploy from this repository: `Software/` has ZERO tracked files (every
# Software/* directory is an untracked nested git repo), so these path filters can never match,
# and this file exists only on canonical while the trigger names `main`. It has never run — no
# history at all. There is therefore no deployment to preserve and no duplicate-deploy risk.
#
# The push trigger is left in place rather than removed, so that if Software/Pale is ever brought
# under this repository's control the intent is still recorded — but `workflow_dispatch` is added
# so emergency and rollback deploys remain possible without relying on a trigger that cannot fire.
# Decide deployment authority explicitly before making this automatic on any branch.
on:
  push:
    branches:
      - main
    paths:
      - "Software/Pale/backend/**"
      - "Software/Pale/packages/**"
      - "Software/Pale/infra/**"
  workflow_dispatch:

defaults:
  run:
    working-directory: Software/Pale

jobs:
  deploy-backend:
    name: Deploy Backend to Staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging

    env:
      FLY_API_TOKEN: ${{ secrets.PALE_FLY_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: Software/Pale/pnpm-lock.yaml

      - name: Install fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build backend
        run: pnpm --filter @pale/backend build

      - name: Run DB migrations
        working-directory: Software/Pale/backend
        env:
          DATABASE_URL: ${{ secrets.PALE_STAGING_DATABASE_URL }}
        run: pnpm prisma migrate deploy

      - name: Deploy to Fly.io
        working-directory: Software/Pale/backend
        run: flyctl deploy --remote-only --app pale-backend-staging
