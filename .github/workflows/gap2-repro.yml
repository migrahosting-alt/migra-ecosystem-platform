name: gap2-repro
# Repeats the fresh-clone reproducibility proof for the MigraAI delegation stack:
# install → build every workspace → brain suite → extension unit suite.
# No Docker/Postgres required (deterministic Tier-A tests only); delegation stays
# OFF by default and nothing here enables or deploys it.
#
# 🚨 THE TRIGGERS ARE THE POINT, AND THEY WERE THE HOLE.
#
# This job would have caught the Brain becoming unbuildable from a clean clone —
# `server.ts` committed importing five RAG modules that were never added to git —
# on the commit that introduced it. It never ran, because it only fired for PRs
# into two named branches and pushes to a third, and the work happened on none of
# them. A correct gate wired to the wrong branch is not a gate; the defect reached
# production and was found by hand.
#
# So it now runs on EVERY branch, filtered by the paths that can actually break it
# rather than by which branch someone happened to be on.

# 🚨 THE FILTER MUST COVER EVERYTHING THE JOB BUILDS.
#
# It listed brain-service, the extension and packages/ — but the job runs
# `npm run build -ws`, which builds EVERY workspace. So a change to
# migrapilot-consumer could break this gate without triggering it, and did: the
# commit that finally fixed a day of red builds did not run the gate at all,
# because it touched only the consumer. A filter narrower than the job is a gate
# with holes in it.
#
# 🚨 THE PATH LIST IS WRITTEN OUT TWICE ON PURPOSE.
#
# It was a YAML anchor (&build_inputs / *build_inputs), which is valid YAML and is
# NOT supported by the GitHub Actions parser. The workflow still reported `state:
# active`, so it looked fine — and silently did not run on a single push for the
# whole day after it was "fixed". Duplication that runs beats elegance that does
# not; if these two lists drift, CI runs on more than it needs to, which is the
# safe direction.
on:
  pull_request:
    paths:
      - 'apps/brain-service/**'
      - 'apps/vscode-extension/**'
      - 'apps/migrapilot-consumer/**'
      - 'packages/**'
      - 'MigraTeck/packages/auth-client/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/gap2-repro.yml'
  push:
    branches: ['**']
    paths:
      - 'apps/brain-service/**'
      - 'apps/vscode-extension/**'
      - 'apps/migrapilot-consumer/**'
      - 'packages/**'
      - 'MigraTeck/packages/auth-client/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/gap2-repro.yml'
  workflow_dispatch:

jobs:
  fresh-clone-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # brain-service uses node:sqlite (Node >= 22)
      # ── SYSTEM DEPENDENCIES PRODUCTION ACTUALLY HAS ────────────────────────
      #
      # poppler-utils is a RUNTIME dependency of the Brain, not a test fixture:
      # scannedPdfJob.ts and pdfTextLayer.ts spawn `pdfinfo` and `pdftotext` to
      # read one PDF page per subprocess, which is how a 35 MB document is
      # ingested without the parser ever holding it in memory.
      #
      # VM111 has it and so does the workstation, so the suite passed everywhere
      # anyone looked while failing here with `spawn pdfinfo ENOENT`. Skipping
      # those tests would have been the easy fix and the wrong one — it would
      # hide a real, undeclared system requirement of the service. The gate
      # should provision what production runs, and then prove it.
      - name: System dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          pdfinfo -v 2>&1 | head -1
      # `ci`, not `install`: it installs the lockfile EXACTLY and fails when
      # package.json and the lockfile disagree. `install` will quietly resolve a
      # working tree that a clean clone could not reproduce, which is the whole
      # class of problem this job exists to detect.
      - name: Install (clean, lockfile-exact)
        run: npm ci --no-audit --no-fund
      - name: Build all workspaces
        run: npm run build -ws
      - name: Brain suite
        working-directory: apps/brain-service
        run: node --test 'dist/test/*.test.js'
      - name: Extension unit suite
        working-directory: apps/vscode-extension
        run: node --test dist/test/unit/*.test.js
