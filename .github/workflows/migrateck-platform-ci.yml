name: MigraTeck Platform CI

on:
  pull_request:
    paths:
      - "MigraTeck/**"
      - ".github/workflows/migrateck-platform-ci.yml"
  push:
    branches:
      - main
    paths:
      - "MigraTeck/**"
      - ".github/workflows/migrateck-platform-ci.yml"

# Least privilege, declared explicitly rather than inherited. The repository default is
# already `read`, but a default is a setting someone can change; this is a guarantee.
permissions:
  contents: read

jobs:
  validate:
    # Distinct context name. `main` carries universal-required-gates.yml, which emits `validate`
    # and `secret-scan` UNCONDITIONALLY and is what makes main's branch protection satisfiable.
    # This workflow emitted the same two names while being path-filtered to MigraTeck/**. Once the
    # two histories are reconciled both workflows coexist, and protection matches by context NAME —
    # two check-runs called `validate` are indistinguishable to it. Renaming the canonical side
    # keeps main's required names untouched and unambiguous.
    name: canonical-platform-validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MigraTeck
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: MigraTeck/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # `--recursive` is not an option of `pnpm audit` (it is a global filter flag), so the
      # previous invocation aborted on "Unknown option" every run — the gate reported a
      # configuration error, never a verdict. `pnpm audit` already covers the whole
      # workspace because it reads the lockfile.
      - name: Dependency scan
        run: pnpm audit --prod

  secret-scan:
    # Renamed for the same reason as the validate job above. Note the two implementations are not
    # interchangeable: main's `secret-scan` is a Python change-set scanner with runtime-generated
    # fixtures, this one is gitleaks plus a detection self-proof. Both are kept — they scan
    # differently — which is exactly why they must not share a context name.
    name: canonical-platform-secret-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks-action reads the PR's commit list to determine the scan range.
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # gitleaks scans the PR's commit RANGE, so the default shallow clone
          # (fetch-depth: 1) leaves it nothing to compare against.
          fetch-depth: 0

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          # Redact match text everywhere gitleaks can emit it. Findings must report rule,
          # path and line — never the value. On a PUBLIC repository a verbose scanner is a
          # disclosure channel, so this is a safety control, not tidiness.
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"
          # REQUIRED since gitleaks-action v2.3.0. Without it the action aborts during
          # initialization with "GITHUB_TOKEN is now required to scan pull requests" —
          # it never scans, so every run is a configuration error rather than a verdict.
          # This is the automatically-provisioned per-run token; it is masked in logs by
          # the runner and is never echoed by this workflow.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Proves the scanner actually detects secrets, rather than trusting that a passing
      # job means it ran. Fixtures are synthetic and live outside the repository.
      - name: Verify the scanner detects secrets
        run: bash .github/scripts/verify-secret-scan.sh
        working-directory: ${{ github.workspace }}
