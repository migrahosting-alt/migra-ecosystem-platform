<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MigraPilot Voice</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #1a1030, #0b0910);
    color: #ece9f5;
  }
  .card {
    width: min(440px, 92vw); padding: 28px; border-radius: 18px;
    background: rgba(24,18,38,.7); border: 1px solid #2a2140;
    box-shadow: 0 20px 60px rgba(0,0,0,.45); text-align: center;
  }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: #9b93b5; font-size: 13px; margin: 0 0 22px; }
  .mic {
    width: 104px; height: 104px; border-radius: 50%; border: none; cursor: pointer;
    background: linear-gradient(180deg, #a78bfa, #7c3aed); color: #fff; font-size: 40px;
    display: grid; place-items: center; margin: 0 auto 10px; transition: transform .1s;
    box-shadow: 0 8px 30px rgba(124,58,237,.5);
  }
  .mic:hover { transform: scale(1.04); }
  .mic.rec { background: linear-gradient(180deg, #f87171, #e5484d); animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(229,72,77,.5); } 50% { box-shadow: 0 0 0 16px rgba(229,72,77,0); } }
  .big { font-size: 13px; color: #cbb8ff; margin: 0 0 14px; font-weight: 600; }
  .status { font-size: 14px; min-height: 22px; color: #cfc9e6; }
  .ok { color: #4ade80; } .err { color: #f87171; }
  .meter { display: flex; align-items: flex-end; justify-content: center; gap: 3px; height: 34px; margin: 10px 0 4px; }
  .meter i { width: 5px; background: linear-gradient(180deg,#a78bfa,#7c3aed); border-radius: 2px; height: 12%; transition: height .06s; opacity:.6; }
  .hint { color: #736c8c; font-size: 11.5px; margin-top: 18px; }
</style>
</head>
<body>
  <div class="card">
    <h1>🎙 MigraPilot Voice</h1>
    <p class="sub">Speak as long as you need — click the mic when you're done.</p>
    <button class="mic" id="mic" title="Click to stop">🎙</button>
    <div class="big" id="big">● Click the mic to stop &amp; send</div>
    <div class="meter" id="meter"></div>
    <div class="status" id="status">Starting microphone…</div>
    <div class="hint" id="hint">First time only: allow the mic. Nothing is sent until you click the mic to stop. Audio is transcribed on your machine — nothing leaves your network.</div>
  </div>
<script>
  const params = new URLSearchParams(location.search);
  const session = params.get("session") || "";
  const micBtn = document.getElementById("mic");
  const statusEl = document.getElementById("status");
  const bigEl = document.getElementById("big");
  const meter = document.getElementById("meter");
  const BARS = 24, MAX_MS = 180000; // 3-min safety cap only
  let recorder=null, chunks=[], stream=null, audioCtx=null, analyser=null, rafId=null;
  let recording=false, done=false, sending=false, startedAt=0;

  function setStatus(t, cls){ statusEl.textContent = t; statusEl.className = "status" + (cls ? " " + cls : ""); }
  function buildBars(){ if (meter.children.length) return; for(let i=0;i<BARS;i++) meter.appendChild(document.createElement("i")); }
  function paintMeter(){
    if(!analyser) return;
    const d=new Uint8Array(analyser.frequencyBinCount); analyser.getByteFrequencyData(d);
    const bars=meter.children, step=Math.floor(d.length/bars.length)||1;
    for(let i=0;i<bars.length;i++){ bars[i].style.height=Math.max(10,Math.round((d[i*step]/255)*100))+"%"; }
  }
  function loop(){
    if(!recording) return;
    paintMeter();
    if(performance.now() - startedAt > MAX_MS){ setStatus("Reached 3-minute limit — sending…"); stop(); return; }
    rafId = requestAnimationFrame(loop);
  }
  function cleanupAudio(){
    if(rafId) cancelAnimationFrame(rafId); rafId=null;
    if(audioCtx){ try{audioCtx.close();}catch(e){} audioCtx=null; } analyser=null;
    if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
  }

  async function start(){
    if(!session){ setStatus("Missing session — reopen from VS Code.", "err"); return; }
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ setStatus("This browser can't record audio.", "err"); return; }
    setStatus("Starting microphone…"); bigEl.style.visibility="hidden";
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch(e){ setStatus("Microphone blocked: " + (e && e.name || "denied") + ". Allow it and reopen.", "err"); return; }
    chunks=[];
    let mime="";
    if (window.MediaRecorder){
      if (MediaRecorder.isTypeSupported("audio/webm;codecs=opus")) mime="audio/webm;codecs=opus";
      else if (MediaRecorder.isTypeSupported("audio/webm")) mime="audio/webm";
      else if (MediaRecorder.isTypeSupported("audio/ogg;codecs=opus")) mime="audio/ogg;codecs=opus";
    } else { setStatus("Recording not supported in this browser.", "err"); return; }
    recorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
    recorder.ondataavailable = (e)=>{ if(e.data && e.data.size) chunks.push(e.data); };
    recorder.onstop = onStop;
    try {
      audioCtx = new (window.AudioContext||window.webkitAudioContext)();
      const s = audioCtx.createMediaStreamSource(stream);
      analyser = audioCtx.createAnalyser(); analyser.fftSize = 512; s.connect(analyser);
    } catch(e){}
    buildBars();
    recorder.start();
    recording = true; startedAt = performance.now();
    micBtn.classList.add("rec"); bigEl.style.visibility="visible"; bigEl.textContent="● Recording — click the mic to stop & send";
    setStatus("Listening… take your time.");
    loop();
  }
  function stop(){ if(recorder && recorder.state !== "inactive"){ recording=false; try{ recorder.stop(); }catch(e){} } }

  async function onStop(){
    const blob = new Blob(chunks, { type: (recorder && recorder.mimeType) || "audio/webm" });
    micBtn.classList.remove("rec"); recording=false; bigEl.style.visibility="hidden"; cleanupAudio();
    if(!blob.size || sending){ if(!sending) setStatus("No audio — click the mic to record again."); return; }
    sending = true; setStatus("Transcribing on your machine…");
    const reader = new FileReader();
    reader.onload = async ()=>{
      try {
        const tr = await fetch("/api/pilot/transcribe", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ audio:String(reader.result), mime: blob.type }) });
        const data = await tr.json();
        sending = false;
        if(!tr.ok || data.error){ setStatus("Transcription failed: " + (data.error||tr.status) + " — click mic to retry.", "err"); return; }
        const text = (data.text||"").trim();
        if(!text){ setStatus("No speech detected — click the mic to try again."); return; }
        await fetch("/api/pilot/voice-inbox", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ session, text }) });
        done = true;
        setStatus("✓ Sent to VS Code.", "ok");
        document.getElementById("hint").textContent = "“" + text + "”  —  you can close this tab, or click the mic to record again.";
      } catch(e){ sending=false; setStatus("Couldn't reach MigraPilot: " + (e && e.message || "error"), "err"); }
    };
    reader.readAsDataURL(blob);
  }

  // Mic button: stop-and-send while recording; record again when idle/finished.
  micBtn.addEventListener("click", ()=>{
    if(recording){ stop(); }
    else if(!sending){ done=false; start(); }
  });

  // Auto-start recording on open (hands-free begin; you stop it manually).
  start();
</script>
</body>
</html>
